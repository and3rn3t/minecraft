[coverage:run]
source = api
omit =
    */tests/*
    */test_*
    */__pycache__/*
    */venv/*
    */env/*

[coverage:report]
# Coverage threshold: a ratchet, set a few points under the measured total
# (see the pytest coverage report) so a real regression fails while a small
# refactor does not. Raise it as coverage grows; never lower it to make a
# change pass.
fail_under = 77
precision = 2
show_missing = True
skip_covered = False
skip_empty = True

# Coverage exclusions
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

[coverage:html]
directory = htmlcov

[coverage:xml]
output = coverage.xml

[coverage:json]
output = coverage.json
pretty_print = True
