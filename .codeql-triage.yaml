# Findings reviewed and judged not to be defects.
#
# Each entry needs a rule, a path, a reason and a count. `make codeql` reports matching
# findings in their own section and does not fail on them; everything else
# still fails. Keep this short — it is an argument that has been made and
# checked, not a place to put findings that are inconvenient.
#
# The count is how many findings the entry covered when it was reviewed. If
# the number grows, the run fails: matching on rule and file alone would exempt
# a *new* finding of that rule anywhere in that file, which is how an exemption
# quietly becomes a blind spot.
#
# Anything listed here should have a test that would fail if the reasoning
# stopped holding. The tests are named in each reason.

triaged:
  - rule: py/path-injection
    path: api/blueprints/files.py
    count: 25
    reason: >-
      The file browser routes resolve the path through server.py's
      resolve_allowed_path(), which checks is_relative_to against an
      allowlist (os.path.realpath + a separator-terminated prefix, the shape
      CodeQL recognises as a sanitizer in-file). That recognition does not
      cross the module boundary once the routes moved to their own blueprint
      file and call it as server.resolve_allowed_path(...) -- confirmed by
      trying a direct `from api.server import resolve_allowed_path` too,
      which changed nothing here and added a real cyclic-import flag of its
      own. tests/api/test_path_traversal.py attacks all of these routes
      directly, symlink escapes included, so the defense cannot be removed
      quietly regardless of what CodeQL can see. (Formerly a single 32-count
      entry on api/server.py, before the file-browser, config-file and backup
      routes moved to their own blueprint files -- same reviewed patterns,
      new locations.)

  - rule: py/path-injection
    path: api/blueprints/config_files.py
    count: 3
    reason: >-
      The config endpoints use the request value only as a dict key into
      CONFIG_ALLOWED_PATHS; the resolved path never depends on it directly.
      CodeQL cannot model that as a sanitizer. tests/api/test_path_traversal.py
      attacks these routes too.

  - rule: py/path-injection
    path: api/blueprints/backups.py
    count: 3
    reason: >-
      The backup endpoints reject any filename containing "..", "/" or "\\"
      before using it. CodeQL cannot model that as a sanitizer.
      tests/api/test_path_traversal.py attacks these routes too.

  - rule: py/clear-text-storage-sensitive-data
    path: api/server.py
    count: 1
    reason: >-
      The value derived from API_KEYS and written to the audit log is the key's
      name — the label someone typed — not the key. Asserted by
      TestAuditLogDoesNotStoreSecrets.
