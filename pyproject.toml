[tool.black]
line-length = 120
target-version = ['py311', 'py312', 'py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
  | __pycache__
)/
'''

[tool.ruff]
# The one place the ruff settings live. The editor extension, the pre-commit
# hook and scripts/lint.sh all discover this file, so they cannot drift apart
# the way three copies of the same command-line flags did.
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "node_modules",
]

[tool.ruff.lint]
# Rules that flag defects or keep the code consistent, not preferences. The full
# default rule set reports 450+ findings here, nearly all style, which would
# train everyone to ignore it; families are added one at a time instead. See
# "Known baselines" in AGENTS.md for what is still off.
#
#   F        pyflakes: undefined names, unused imports, redefinitions
#   E4 E7 E9 pycodestyle's import, statement and syntax errors (not line length or
#            whitespace: Black owns those)
#   B        bugbear: likely bugs (mutable defaults, zip without strict, ...)
#   I        isort: import order
#   BLE      blind `except Exception`. Catching everything is sometimes right (a
#            route handler that logs and returns a generic 500, a worker that must
#            outlive a bad item), so those say why: `# noqa: BLE001 - <reason>`.
#            Where the failure modes are known, catch those instead.
#   RUF100   a `# noqa` that no longer suppresses anything
select = ["F", "E4", "E7", "E9", "B", "I", "BLE", "RUF100"]

[tool.ruff.lint.isort]
known-first-party = ["api"]

[tool.pytest.ini_options]
testpaths = ["tests/api"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
# Keep in sync with tests/api/pytest.ini, which is the config actually used
# when the suite runs from tests/api (--strict-markers is enabled in both).
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "api: API endpoint tests",
    "slow: Slow running tests",
    "performance: Performance tests",
    "contract: API contract tests",
    "e2e: End-to-end tests",
    "real_subprocess: Allowed to start real processes (conftest refuses them otherwise)",
]

# Coverage settings live in .coverage-config.ini (a single source of truth,
# referenced explicitly by the Makefile and scripts/check-coverage.sh).

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "venv",
    ".pytest_cache",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
