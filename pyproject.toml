[tool.black]
line-length = 120
target-version = ['py311', 'py312', 'py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
  | __pycache__
)/
'''

[tool.ruff]
# The one place the ruff settings live. The editor extension, the pre-commit
# hook and scripts/lint.sh all discover this file, so they cannot drift apart
# the way three copies of the same command-line flags did.
line-length = 120
target-version = "py311"
# No exclude key. Setting "exclude" *replaces* ruff's defaults rather than
# adding to them, so a short custom list silently drops .mypy_cache,
# .pytest_cache, .ruff_cache, .tox and the rest — 25 defaults for 7 entries.
# Nothing here needs excluding beyond them: the only build/ directories are
# under node_modules, which is a default, and __pycache__ holds no .py files
# for ruff to read. Use extend-exclude if that ever changes.

[tool.ruff.lint]
# Pyflakes only: undefined names, redefinitions, unused imports — defects
# rather than preferences. The full default rule set reports 450+ findings on
# this repo, nearly all style, which would train everyone to ignore it. See
# "Known baselines" in AGENTS.md.
select = ["F"]

[tool.pytest.ini_options]
testpaths = ["tests/api"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
# Keep in sync with tests/api/pytest.ini, which is the config actually used
# when the suite runs from tests/api (--strict-markers is enabled in both).
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "api: API endpoint tests",
    "slow: Slow running tests",
    "performance: Performance tests",
    "contract: API contract tests",
    "e2e: End-to-end tests",
]

# Coverage settings live in .coverage-config.ini (a single source of truth,
# referenced explicitly by the Makefile and scripts/check-coverage.sh).

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "venv",
    ".pytest_cache",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
