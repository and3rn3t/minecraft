# Gitleaks configuration.
#
# The default rules are kept in full; this file only records the placeholder
# credentials that live in the test suite, which the generic-api-key rule flags
# on entropy alone.
#
# The allowlist matches those exact strings rather than whitelisting the tests
# directory, so a credential that really did leak into a test still fails the
# scan.

[extend]
useDefault = true

[allowlist]
description = "Fixed placeholder credentials in tests and docs, never real ones"
regexTarget = "match"
regexes = [
  # tests/api/*: the dummy key every API-key fixture authenticates with.
  '''test-api-key-1234567890+''',
  # The "mc_" prefix marks the made-up keys in the tests and in the examples in
  # docs/API_KEYS.md. No real key can match: generate_api_key() draws 32
  # characters from an alphabet of letters and digits only, so a generated key
  # can never contain an underscore.
  '''mc_[A-Za-z0-9]+''',
]
