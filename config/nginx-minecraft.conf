# Nginx site config for the Minecraft web admin panel.
# Install: sudo cp config/nginx-minecraft.conf /etc/nginx/sites-available/minecraft
#          sudo ln -s /etc/nginx/sites-available/minecraft /etc/nginx/sites-enabled/
#
# Serves the built React app (web/dist) as static files and reverse-proxies
# /api and /socket.io to the Flask-SocketIO API server (api/server.py), which
# only listens on 127.0.0.1:8080 by default (see api/server.py's API_HOST).
# /socket.io is Socket.IO's default handshake path (see api/server.py's
# SocketIO(...) call, which doesn't override it) — the web client connects to
# the page's own origin, so this is the path that actually needs proxying,
# not an arbitrary /ws.

server {
    listen 80;
    server_name minecraft-admin.local;

    root /home/pi/minecraft-server/web/dist;
    index index.html;

    access_log /var/log/nginx/minecraft-web-access.log;
    error_log /var/log/nginx/minecraft-web-error.log;

    # Debian's default nginx.conf enables gzip but its default gzip_types is
    # text/html only, so the JS/CSS bundle (~680KB) was going out
    # uncompressed. Set the types explicitly here rather than relying on
    # whatever the global config happens to have.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types
        text/css
        text/plain
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite content-hashes these filenames (e.g. index-Cs25yyO3.js), so a new
    # build gets a new URL and this is safe to cache aggressively. index.html
    # itself is served by the location above and inherits nginx's default
    # (uncached) headers, so a new build is picked up on the next visit.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
