# Nginx site config for the Minecraft web admin panel.
# Install: sudo cp config/nginx-minecraft.conf /etc/nginx/sites-available/minecraft
#          sudo ln -s /etc/nginx/sites-available/minecraft /etc/nginx/sites-enabled/
#
# Serves the built React app (web/dist) as static files and reverse-proxies
# /api and /ws to the Flask-SocketIO API server (api/server.py), which only
# listens on 127.0.0.1:8080 by default (see api/server.py's API_HOST).

server {
    listen 80;
    server_name minecraft-admin.local;

    root /home/pi/minecraft-server/web/dist;
    index index.html;

    access_log /var/log/nginx/minecraft-web-access.log;
    error_log /var/log/nginx/minecraft-web-error.log;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
