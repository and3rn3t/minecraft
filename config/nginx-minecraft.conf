# Nginx site config for the Minecraft web admin panel.
# Install: sudo cp config/nginx-minecraft.conf /etc/nginx/sites-available/minecraft
#          sudo ln -s /etc/nginx/sites-available/minecraft /etc/nginx/sites-enabled/
#
# Serves the built React app (web/dist) as static files and reverse-proxies
# /api and /socket.io to the Flask-SocketIO API server (api/server.py), which
# only listens on 127.0.0.1:8080 by default (see api/server.py's API_HOST).
# /socket.io is Socket.IO's default handshake path (see api/server.py's
# SocketIO(...) call, which doesn't override it) — the web client connects to
# the page's own origin, so this is the path that actually needs proxying,
# not an arbitrary /ws.
#
# For internet exposure via a Cloudflare Tunnel (see
# config/cloudflared-config.yml.example and docs/SECURITY_HARDENING.md),
# cloudflared runs on this same Pi and reaches nginx over loopback -- nothing
# needs to accept inbound connections from the WAN directly, so `listen`
# below is bound to 127.0.0.1 rather than every interface.

# Zone for /api/auth/* specifically: login/register/2FA/OAuth already have
# their own per-route limits in api/server.py (@auth_rate_limit), but that's
# in-process and per-worker; this is a second, independent layer that holds
# even if the app-layer limiter is ever misconfigured or bypassed. 10r/m ~=
# api/server.py's tightest limit (5/minute on login); burst absorbs a
# legitimate user's occasional double-click without themselves 429ing.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

server {
    listen 127.0.0.1:80;
    server_name minecraft-admin.local;

    # Cloudflare Tunnel terminates TLS and cloudflared forwards to here over
    # loopback, so nginx's own peer address ($remote_addr) is 127.0.0.1 for
    # every visitor -- without correcting it, the X-Forwarded-For header
    # below, the access log, and auth_limit's $binary_remote_addr would all
    # collapse to that one address, making the per-IP rate limit a single
    # bucket shared by everyone. Cloudflare's edge sets CF-Connecting-IP
    # with the real visitor IP on every request that reaches cloudflared
    # (tunnel or not), so recover $remote_addr from there instead of trying
    # to reconstruct it from X-Forwarded-For's hop count, which isn't
    # something this config can verify cloudflared preserves consistently.
    # Requires ngx_http_realip_module (built into Debian's `nginx`/
    # `nginx-full` packages, not `nginx-light`; check with
    # `nginx -V 2>&1 | grep -o with-http_realip_module`).
    #
    # Only trusted from 127.0.0.1: if you're not using the Cloudflare
    # Tunnel path, remove this block entirely -- trusting CF-Connecting-IP
    # from a source that isn't actually Cloudflare lets any client set its
    # own "real" IP just by sending that header.
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    root /home/pi/minecraft-server/web/dist;
    index index.html;

    access_log /var/log/nginx/minecraft-web-access.log;
    error_log /var/log/nginx/minecraft-web-error.log;

    # Debian's default nginx.conf enables gzip but its default gzip_types is
    # text/html only, so the JS/CSS bundle (~680KB) was going out
    # uncompressed. Set the types explicitly here rather than relying on
    # whatever the global config happens to have.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types
        text/css
        text/plain
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # api/server.py's security_headers() only ever touches Flask's own
    # responses -- it never runs for index.html or the JS/CSS bundle, which
    # nginx serves directly from disk and Flask never sees. A browser
    # enforces CSP/X-Frame-Options/etc. from the response that delivered
    # the *document*, not from later same-page API calls, so without this
    # the page that actually loads the React app would ship with none of
    # these headers at all. Kept in sync by hand with api/server.py's _CSP
    # and security_headers().
    #
    # Set inside location / and location /assets/ specifically (nginx does
    # NOT inherit add_header from the server block into a location that
    # sets its own, which /assets/ does for Cache-Control -- hence the
    # repeat below) rather than at the server level, so they apply only to
    # the static site. /api, /api/auth and /socket.io are deliberately left
    # out: Flask already sets its own copy of these on every response
    # through those locations, and nginx's add_header on a proxied response
    # adds to rather than replaces what the upstream already sent, which
    # would otherwise duplicate every one of them.
    # Exact match, so this takes priority over the general location /
    # below regardless of file order. GET here is a real visitor's browser
    # landing on the OAuth callback page (including this block's own
    # redirect target below) -- served by the SPA like any other route.
    # POST here can only be Apple's form_post OAuth response: Apple
    # requires that response mode whenever the requested scope includes
    # name/email (which the Apple sign-in flow does), so it POSTs the
    # result to this path instead of redirecting with it in the URL, and
    # the SPA has no way to read a POST body. api/server.py's
    # apple_oauth_form_post_relay re-issues it as a redirect to this same
    # path with the same fields as query params instead, which the SPA
    # already knows how to read (see web/src/pages/OAuthCallback.jsx).
    location = /oauth/callback {
        if ($request_method = POST) {
            proxy_pass http://127.0.0.1:8080;
        }
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    # Vite content-hashes these filenames (e.g. index-Cs25yyO3.js), so a new
    # build gets a new URL and this is safe to cache aggressively. index.html
    # itself is served by the location above and inherits nginx's default
    # (uncached) headers, so a new build is picked up on the next visit.
    #
    # nginx doesn't inherit server-level add_header directives into a
    # location that sets its own (the Cache-Control below), so the security
    # headers above are repeated here rather than silently dropped for
    # every asset request.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    # More specific than the general /api block below, so nginx matches
    # this one first for auth routes (longest-prefix match).
    location /api/auth {
        limit_req zone=auth_limit burst=5 nodelay;
        # nginx's own default for a rejected request is 503 (Service
        # Unavailable), which reads as "the server is down" rather than
        # "you're being throttled" -- confirmed live (curl in a tight loop
        # got 429s from api/server.py's own limiter first, then 503s once
        # nginx's burst was also exhausted). 429 matches what
        # api/server.py's Flask-Limiter already returns, so a client sees
        # one consistent status for "slow down" regardless of which layer
        # caught it.
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
