# Nginx site config for the Minecraft web admin panel.
# Install: sudo cp config/nginx-minecraft.conf /etc/nginx/sites-available/minecraft
#          sudo ln -s /etc/nginx/sites-available/minecraft /etc/nginx/sites-enabled/
#
# Serves the built React app (web/dist) as static files and reverse-proxies
# /api and /socket.io to the Flask-SocketIO API server (api/server.py), which
# only listens on 127.0.0.1:8080 by default (see api/server.py's API_HOST).
# /socket.io is Socket.IO's default handshake path (see api/server.py's
# SocketIO(...) call, which doesn't override it) — the web client connects to
# the page's own origin, so this is the path that actually needs proxying,
# not an arbitrary /ws.
#
# For internet exposure via a Cloudflare Tunnel (see
# config/cloudflared-config.yml.example and docs/SECURITY_HARDENING.md),
# cloudflared runs on this same Pi and reaches nginx over loopback -- nothing
# needs to accept inbound connections from the WAN directly, so `listen`
# below is bound to 127.0.0.1 rather than every interface.

# Zone for /api/auth/* specifically: login/register/2FA/OAuth already have
# their own per-route limits in api/server.py (@auth_rate_limit), but that's
# in-process and per-worker; this is a second, independent layer that holds
# even if the app-layer limiter is ever misconfigured or bypassed. 10r/m ~=
# api/server.py's tightest limit (5/minute on login); burst absorbs a
# legitimate user's occasional double-click without themselves 429ing.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

server {
    listen 127.0.0.1:80;
    server_name minecraft-admin.local;

    root /home/pi/minecraft-server/web/dist;
    index index.html;

    access_log /var/log/nginx/minecraft-web-access.log;
    error_log /var/log/nginx/minecraft-web-error.log;

    # Debian's default nginx.conf enables gzip but its default gzip_types is
    # text/html only, so the JS/CSS bundle (~680KB) was going out
    # uncompressed. Set the types explicitly here rather than relying on
    # whatever the global config happens to have.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types
        text/css
        text/plain
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite content-hashes these filenames (e.g. index-Cs25yyO3.js), so a new
    # build gets a new URL and this is safe to cache aggressively. index.html
    # itself is served by the location above and inherits nginx's default
    # (uncached) headers, so a new build is picked up on the next visit.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # More specific than the general /api block below, so nginx matches
    # this one first for auth routes (longest-prefix match).
    location /api/auth {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
