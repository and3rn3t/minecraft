openapi: 3.0.3
info:
  title: Minecraft Server Management API
  description: |
    REST API for managing Minecraft server on Raspberry Pi 5.

    Provides endpoints for:
    - Server control (start, stop, restart, commands)
    - Backup management (create, list, restore, delete)
    - Player management (list, whitelist, ban, op)
    - World management
    - Plugin management
    - Configuration file management
    - Monitoring and metrics
    - User authentication and authorization
    - API key management
    - Dynamic DNS management

  version: 1.4.0
  contact:
    name: Minecraft Server Project
    url: https://github.com/and3rn3t/minecraft
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080
    description: Local development server
  - url: http://minecraft-server.local:8080
    description: Raspberry Pi server (local network)
  - url: https://your-domain.com:8080
    description: Production server (with SSL)

tags:
  - name: Health
    description: Health check endpoints
  - name: Authentication
    description: User authentication and registration
  - name: API Keys
    description: API key management
  - name: Users
    description: User management
  - name: Roles & Permissions
    description: Role-based access control
  - name: Server Control
    description: Server start, stop, restart, commands
  - name: Backups
    description: Backup creation, listing, restore, deletion
  - name: Players
    description: Player management
  - name: Worlds
    description: World management
  - name: Plugins
    description: Plugin management
  - name: Configuration
    description: Configuration file management
  - name: Logs
    description: Server log access
  - name: Metrics
    description: Server metrics and monitoring
  - name: Dynamic DNS
    description: Dynamic DNS management
  - name: Scheduler
    description: Scheduled server commands, run by scripts/command-scheduler.py

security:
  - ApiKeyAuth: []
  - BearerAuth: []
  - SessionAuth: []

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for programmatic access
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token from login endpoint
    SessionAuth:
      type: apiKey
      in: cookie
      name: session
      description: Session cookie from login

  schemas:
    Schedule:
      type: object
      properties:
        id:
          type: string
          format: uuid
        command:
          type: string
        type:
          type: string
          enum: [interval, daily, weekly, cron, once]
        enabled:
          type: boolean
        created:
          type: string
          format: date-time
        last_run:
          type: string
          format: date-time
          nullable: true
        run_count:
          type: integer
        interval_minutes:
          type: integer
        run_time:
          type: string
        day_of_week:
          type: integer
        cron_expression:
          type: string
        run_datetime:
          type: string
        condition:
          type: object
    BedtimeStatus:
      type: object
      properties:
        enabled:
          type: boolean
        closed:
          type: boolean
          description: Whether the server is inside a bedtime window right now
        skipped_tonight:
          type: boolean
        next_bedtime:
          type: string
          description: Local time of the next bedtime that will be enforced
        seconds_until_bedtime:
          type: integer
          nullable: true
          description: Null while the window is already closed
        opens_at:
          type: string
          nullable: true
          description: When the server opens again, while closed
        extensions_used:
          type: integer
        extensions_allowed:
          type: integer
        extend_minutes:
          type: integer
        action:
          type: string
          enum: [stop, kick, announce]
        weeknight_bedtime:
          type: string
        weekend_bedtime:
          type: string
        wake_time:
          type: string

    BedtimeControlResult:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        status:
          $ref: '#/components/schemas/BedtimeStatus'

    DeathRecord:
      type: object
      properties:
        player:
          type: string
        cause:
          type: string
          description: The vanilla death cause, without the player's name
          example: was slain by Zombie
        category:
          type: string
          description: Classified cause, used to pick an epitaph and an icon
          example: combat
        epitaph:
          type: string
          example: Here lies Jonah, who met Zombie and did not come to an arrangement.
        culprit:
          type: string
          nullable: true
          description: Who or what did it, when the message names one
        timestamp:
          type: string
          format: date-time
        message:
          type: string
          description: The full death message as the server printed it
        announced:
          type: boolean
          description: Whether the epitaph reached players in game

    GameEvent:
      type: object
      properties:
        type:
          type: string
          description: Event type
          example: death
        timestamp:
          type: string
          format: date-time
          description: When the line was ingested, in UTC
        player:
          type: string
          nullable: true
          description: Player the event concerns, if any
        data:
          type: object
          description: >-
            Type-specific fields. Always includes log_time, the HH:MM:SS the
            server itself printed.
          additionalProperties: true
        raw:
          type: string
          description: The original log line

    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
      required:
        - error

    Success:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
        - success

    Health:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
        timestamp:
          type: string
          format: date-time
      required:
        - status
        - timestamp

    User:
      type: object
      properties:
        username:
          type: string
        role:
          type: string
          enum: [admin, operator, user]
        email:
          type: string
        enabled:
          type: boolean
        created:
          type: string
          format: date-time
      required:
        - username
        - role

    ServerStatus:
      type: object
      properties:
        status:
          type: string
          enum: [running, stopped, starting, stopping]
        uptime:
          type: integer
          description: Uptime in seconds
        players:
          type: integer
        max_players:
          type: integer
        version:
          type: string
      required:
        - status

    Backup:
      type: object
      properties:
        filename:
          type: string
        size:
          type: integer
          description: Size in bytes
        created:
          type: string
          format: date-time
        path:
          type: string
      required:
        - filename
        - size
        - created

    Player:
      type: object
      properties:
        name:
          type: string
        online:
          type: boolean
        uuid:
          type: string
      required:
        - name
        - online

paths:
  /api/health:
    get:
      tags:
        - Health
      summary: Health check
      description: Check API health status (no authentication required)
      operationId: getHealth
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '500':
          description: API is unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []

  /api/auth/register:
    post:
      tags:
        - Authentication
      summary: Register the bootstrap account
      description: >-
        Creates the first user on a fresh server, which is given the admin role.
        Once any user exists this returns 403 and further accounts are created
        with POST /api/users, unless REGISTRATION_ENABLED is set in the
        environment — accounts created that way get the user role.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 32
                password:
                  type: string
                  minLength: 8
                email:
                  type: string
                  format: email
              required:
                - username
                - password
      responses:
        '200':
          description: User registered successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      token:
                        type: string
                        description: JWT token (if available)
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Registration is closed because a user already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []

  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: Login user
      description: Authenticate user and create session
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
              required:
                - username
                - password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      token:
                        type: string
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []

  /api/auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout user
      description: End user session
      operationId: logout
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'

  /api/auth/me:
    get:
      tags:
        - Authentication
      summary: Get current user
      description: Get information about currently authenticated user
      operationId: getCurrentUser
      responses:
        '200':
          description: User information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/status:
    get:
      tags:
        - Server Control
      summary: Get server status
      description: Get current server status and information
      operationId: getServerStatus
      responses:
        '200':
          description: Server status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerStatus'

  /api/server/start:
    post:
      tags:
        - Server Control
      summary: Start server
      description: Start the Minecraft server
      operationId: startServer
      responses:
        '200':
          description: Server started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          description: Server already running or error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/server/stop:
    post:
      tags:
        - Server Control
      summary: Stop server
      description: Stop the Minecraft server
      operationId: stopServer
      responses:
        '200':
          description: Server stopped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'

  /api/server/restart:
    post:
      tags:
        - Server Control
      summary: Restart server
      description: Restart the Minecraft server
      operationId: restartServer
      responses:
        '200':
          description: Server restarted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'

  /api/server/command:
    post:
      tags:
        - Server Control
      summary: Send server command
      description: Execute a command on the Minecraft server
      operationId: sendServerCommand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                command:
                  type: string
                  description: Minecraft server command (e.g., "say Hello")
              required:
                - command
      responses:
        '200':
          description: Command executed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      output:
                        type: string
                        description: Command output

  /api/server/properties/preset:
    post:
      tags:
        - Server Control
      summary: Apply a server.properties performance preset
      description: >-
        Applies one of the presets defined in scripts/server-properties-manager.sh,
        which set view distance, simulation distance, max players, network
        compression and entity broadcast range together. Requires server.manage.
        The server must be restarted for the new values to take effect.
      operationId: applyServerPreset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                preset:
                  type: string
                  enum: [low-end, balanced, high-performance]
              required:
                - preset
      responses:
        '200':
          description: Preset applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          description: Preset missing or not one of the known names
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: The properties manager could not apply the preset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/backup:
    post:
      tags:
        - Backups
      summary: Create backup
      description: Create a new server backup
      operationId: createBackup
      responses:
        '200':
          description: Backup created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      backup:
                        $ref: '#/components/schemas/Backup'

  /api/backups:
    get:
      tags:
        - Backups
      summary: List backups
      description: Get list of all backups
      operationId: listBackups
      responses:
        '200':
          description: List of backups
          content:
            application/json:
              schema:
                type: object
                properties:
                  backups:
                    type: array
                    items:
                      $ref: '#/components/schemas/Backup'

  /api/backups/{filename}/restore:
    post:
      tags:
        - Backups
      summary: Restore backup
      description: Restore server from a backup
      operationId: restoreBackup
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
          description: Backup filename
      responses:
        '200':
          description: Backup restored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '404':
          description: Backup not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/backups/{filename}:
    delete:
      tags:
        - Backups
      summary: Delete backup
      description: Delete a backup file
      operationId: deleteBackup
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
          description: Backup filename
      responses:
        '200':
          description: Backup deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '404':
          description: Backup not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/players:
    get:
      tags:
        - Players
      summary: List players
      description: Get list of players (online and offline)
      operationId: listPlayers
      responses:
        '200':
          description: List of players
          content:
            application/json:
              schema:
                type: object
                properties:
                  players:
                    type: array
                    items:
                      $ref: '#/components/schemas/Player'
                  online_count:
                    type: integer

  /api/worlds:
    get:
      tags:
        - Worlds
      summary: List worlds
      description: Get list of available worlds
      operationId: listWorlds
      responses:
        '200':
          description: List of worlds
          content:
            application/json:
              schema:
                type: object
                properties:
                  worlds:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        active:
                          type: boolean
                        size:
                          type: integer

  /api/plugins:
    get:
      tags:
        - Plugins
      summary: List plugins
      description: Get list of installed plugins
      operationId: listPlugins
      responses:
        '200':
          description: List of plugins
          content:
            application/json:
              schema:
                type: object
                properties:
                  plugins:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        enabled:
                          type: boolean
                        version:
                          type: string

  /api/logs:
    get:
      tags:
        - Logs
      summary: Get server logs
      description: Retrieve server logs
      operationId: getLogs
      parameters:
        - name: lines
          in: query
          schema:
            type: integer
            default: 100
          description: Number of lines to retrieve
        - name: filter
          in: query
          schema:
            type: string
          description: Filter logs by text
      responses:
        '200':
          description: Server logs
          content:
            application/json:
              schema:
                type: object
                properties:
                  logs:
                    type: array
                    items:
                      type: string
                  total_lines:
                    type: integer

  /api/bedtime:
    get:
      tags:
        - Bedtime
      summary: Get bedtime status
      description: |
        The countdown, the closed window and the extension budget.
        Requires the `server.view` permission, so a read-only account can watch
        the countdown.
      operationId: getBedtime
      responses:
        '200':
          description: Current bedtime status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BedtimeStatus'
        '503':
          description: Bedtime mode is unavailable

  /api/bedtime/extend:
    post:
      tags:
        - Bedtime
      summary: Grant more time tonight
      description: Pushes tonight's bedtime back. Requires `server.control`.
      operationId: extendBedtime
      responses:
        '200':
          description: Extension granted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BedtimeControlResult'
        '409':
          description: >-
            Refused, with a reason. The request was well-formed; the server will
            not do it, because the budget is spent or bedtime already happened.
        '503':
          description: Bedtime mode is unavailable

  /api/bedtime/skip:
    post:
      tags:
        - Bedtime
      summary: Skip bedtime tonight
      description: Cancels bedtime for this evening only. Requires `server.control`.
      operationId: skipBedtime
      responses:
        '200':
          description: Bedtime skipped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BedtimeControlResult'
        '409':
          description: Refused, with a reason
        '503':
          description: Bedtime mode is unavailable

  /api/bedtime/now:
    post:
      tags:
        - Bedtime
      summary: Start bedtime immediately
      description: Brings bedtime forward to right now. Requires `server.control`.
      operationId: startBedtimeNow
      responses:
        '200':
          description: Bedtime started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BedtimeControlResult'
        '409':
          description: Refused, with a reason
        '503':
          description: Bedtime mode is unavailable

  /api/deaths:
    get:
      tags:
        - Hall of Deaths
      summary: Get recent deaths with epitaphs
      description: |
        Recent deaths, newest first, each with the epitaph written for it.
        Requires the `players.view` permission.
      operationId: getDeaths
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
          description: Maximum number of deaths to return
        - name: player
          in: query
          schema:
            type: string
          description: Only return deaths for this player
        - name: category
          in: query
          schema:
            type: string
          description: Only return deaths of this category, for example `fall`
      responses:
        '200':
          description: Recent deaths and overall statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  deaths:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeathRecord'
                  stats:
                    type: object
                    properties:
                      total_deaths:
                        type: integer
                      players:
                        type: integer
                      most_common_cause:
                        type: string
                        nullable: true
        '400':
          description: Non-numeric limit
        '503':
          description: The Hall of Deaths is unavailable

  /api/deaths/leaderboard:
    get:
      tags:
        - Hall of Deaths
      summary: Get the death leaderboard
      description: Per-player death totals, most deaths first. Requires `players.view`.
      operationId: getDeathsLeaderboard
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 50
      responses:
        '200':
          description: Ranked players
          content:
            application/json:
              schema:
                type: object
                properties:
                  leaderboard:
                    type: array
                    items:
                      type: object
                      properties:
                        player:
                          type: string
                        deaths:
                          type: integer
                        favourite_cause:
                          type: string
                        favourite_cause_count:
                          type: integer
                          description: >-
                            How often the favourite cause occurred. A value of 1
                            means there is no real pattern, only a tie, so
                            callers should not describe it as a favourite.
                        last_category:
                          type: string
                          description: Category of this player's most recent death
                        last_epitaph:
                          type: string
                        last_death:
                          type: string
        '400':
          description: Non-numeric limit
        '503':
          description: The Hall of Deaths is unavailable

  /api/events:
    get:
      tags:
        - Events
      summary: Get game events
      description: |
        Retrieve game events parsed from the server log, newest first.
        Requires the `logs.view` permission.
      operationId: getEvents
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 500
          description: Maximum number of events to return
        - name: type
          in: query
          schema:
            type: string
            enum:
              - chat
              - connect
              - join
              - leave
              - death
              - advancement
              - command
              - server_ready
              - server_stopping
          description: Only return events of this type
        - name: player
          in: query
          schema:
            type: string
          description: Only return events for this player
      responses:
        '200':
          description: Game events, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/GameEvent'
                  count:
                    type: integer
        '400':
          description: Unknown event type or non-numeric limit
        '503':
          description: Event capture is unavailable

  /api/events/types:
    get:
      tags:
        - Events
      summary: List game event types
      description: List the event types the bus can produce. Requires `logs.view`.
      operationId: getEventTypes
      responses:
        '200':
          description: Known event types
          content:
            application/json:
              schema:
                type: object
                properties:
                  types:
                    type: array
                    items:
                      type: string
        '503':
          description: Event capture is unavailable

  /api/metrics:
    get:
      tags:
        - Metrics
      summary: Get server metrics
      description: Get server performance metrics
      operationId: getMetrics
      responses:
        '200':
          description: Server metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  tps:
                    type: number
                    description: Ticks per second
                  memory_usage:
                    type: integer
                    description: Memory usage in MB
                  cpu_usage:
                    type: number
                    description: CPU usage percentage
                  player_count:
                    type: integer
                  uptime:
                    type: integer
                    description: Uptime in seconds

  /api/config/files:
    get:
      tags:
        - Configuration
      summary: List configuration files
      description: Get list of available configuration files
      operationId: listConfigFiles
      responses:
        '200':
          description: List of configuration files
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        path:
                          type: string
                        size:
                          type: integer

  /api/config/files/{filename}:
    get:
      tags:
        - Configuration
      summary: Get configuration file
      description: Retrieve contents of a configuration file
      operationId: getConfigFile
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
          description: Configuration filename
      responses:
        '200':
          description: Configuration file contents
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: File not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags:
        - Configuration
      summary: Update configuration file
      description: Update contents of a configuration file
      operationId: updateConfigFile
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
          description: Configuration filename
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                  description: File contents
              required:
                - content
      responses:
        '200':
          description: File updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          description: Invalid content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/keys:
    get:
      tags:
        - API Keys
      summary: List API keys
      description: Get list of API keys (preview only, not full keys)
      operationId: listApiKeys
      responses:
        '200':
          description: List of API keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        enabled:
                          type: boolean
                        created:
                          type: string
                          format: date-time
                        role:
                          type: string
                          enum: [admin, operator, user]
                        permissions:
                          type: array
                          items:
                            type: string
                          description: The permissions this key actually grants

    post:
      tags:
        - API Keys
      summary: Create API key
      description: >-
        Create a new API key. Keys are scoped: the role defaults to user
        (read-only), and an explicit permissions array takes precedence over it.
      operationId: createApiKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                role:
                  type: string
                  enum: [admin, operator, user]
                  default: user
                permissions:
                  type: array
                  items:
                    type: string
                  description: Explicit permission allowlist, overriding role
              required:
                - name
      responses:
        '201':
          description: API key created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      key:
                        type: string
                        description: Full API key (shown only on creation)
                      id:
                        type: string
                        description: Key identifier
                      role:
                        type: string
                      permissions:
                        type: array
                        items:
                          type: string
        '400':
          description: Invalid role or unknown permission name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/keys/{keyId}:
    put:
      tags:
        - API Keys
      summary: Change an API key's scope
      description: Narrow or widen what a key may do. Requires api_keys.manage.
      operationId: updateApiKeyScope
      parameters:
        - name: keyId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum: [admin, operator, user]
                permissions:
                  type: array
                  nullable: true
                  items:
                    type: string
                  description: Null drops the allowlist and falls back to the role
      responses:
        '200':
          description: Scope updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      role:
                        type: string
                      permissions:
                        type: array
                        items:
                          type: string
        '400':
          description: No scope given, invalid role, or unknown permission name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: API key not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/users:
    get:
      tags:
        - Users
      summary: List users
      description: Get list of all users
      operationId: listUsers
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
    post:
      tags:
        - Users
      summary: Create a user
      description: Create a user account. Requires the users.manage permission.
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 32
                password:
                  type: string
                  minLength: 8
                email:
                  type: string
                  format: email
                role:
                  type: string
                  enum: [admin, operator, user]
                  default: user
              required:
                - username
                - password
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/ddns/status:
    get:
      tags:
        - Dynamic DNS
      summary: Get DDNS status
      description: Get current Dynamic DNS status
      operationId: getDdnsStatus
      responses:
        '200':
          description: DDNS status
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                  provider:
                    type: string
                  last_update:
                    type: string
                  current_ip:
                    type: string

  /api/ddns/update:
    post:
      tags:
        - Dynamic DNS
      summary: Update DDNS
      description: Manually trigger Dynamic DNS update
      operationId: updateDdns
      responses:
        '200':
          description: DDNS updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'

  /api/scheduler/schedules:
    get:
      tags:
        - Scheduler
      summary: List scheduled commands
      operationId: listSchedules
      responses:
        '200':
          description: The scheduled commands
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      schedules:
                        type: array
                        items:
                          $ref: '#/components/schemas/Schedule'
    post:
      tags:
        - Scheduler
      summary: Create a scheduled command
      description: >-
        Requires server.command. The type decides which further fields are
        required: cron needs cron_expression and once needs run_datetime; a
        type the scheduler cannot fire is rejected rather than stored.
      operationId: createSchedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                command:
                  type: string
                type:
                  type: string
                  enum: [interval, daily, weekly, cron, once]
                  default: interval
                enabled:
                  type: boolean
                  default: true
                interval_minutes:
                  type: integer
                  description: interval schedules; defaults to 60
                run_time:
                  type: string
                  description: daily and weekly schedules, as HH:MM; defaults to 00:00
                day_of_week:
                  type: integer
                  description: weekly schedules, 0=Monday through 6=Sunday
                cron_expression:
                  type: string
                  description: cron schedules; required for them
                run_datetime:
                  type: string
                  description: once schedules, as an ISO 8601 datetime; required for them
                condition:
                  type: object
                  description: Only run when this holds, e.g. a minimum player count
              required:
                - command
      responses:
        '201':
          description: Schedule created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      schedule:
                        $ref: '#/components/schemas/Schedule'
        '400':
          description: Command missing, unknown type, or a field the type requires is absent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/scheduler/schedules/{scheduleId}:
    parameters:
      - name: scheduleId
        in: path
        required: true
        schema:
          type: string
    put:
      tags:
        - Scheduler
      summary: Update a scheduled command
      description: >-
        Changing the type replaces the fields belonging to the old one, so a
        daily schedule switched to interval does not keep a stale run_time.
      operationId: updateSchedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                command:
                  type: string
                type:
                  type: string
                  enum: [interval, daily, weekly, cron, once]
                enabled:
                  type: boolean
                interval_minutes:
                  type: integer
                run_time:
                  type: string
                day_of_week:
                  type: integer
                cron_expression:
                  type: string
                run_datetime:
                  type: string
                condition:
                  type: object
                  nullable: true
      responses:
        '200':
          description: Schedule updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      schedule:
                        $ref: '#/components/schemas/Schedule'
        '400':
          description: Unknown type, or a field the new type requires is absent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Schedule not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Scheduler
      summary: Delete a scheduled command
      operationId: deleteSchedule
      responses:
        '200':
          description: Schedule deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '404':
          description: Schedule not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/scheduler/schedules/{scheduleId}/enable:
    put:
      tags:
        - Scheduler
      summary: Enable a scheduled command
      operationId: enableSchedule
      parameters:
        - name: scheduleId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Schedule enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '404':
          description: Schedule not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/scheduler/schedules/{scheduleId}/disable:
    put:
      tags:
        - Scheduler
      summary: Disable a scheduled command
      operationId: disableSchedule
      parameters:
        - name: scheduleId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Schedule disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '404':
          description: Schedule not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
