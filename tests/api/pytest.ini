[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# --cov-config is required: .coverage-config.ini is not one of the filenames
# coverage.py auto-discovers, and coverage only looks in the current directory,
# which is tests/api for every documented entry point. Without the flag the
# exclusions and fail_under are silently skipped. The Makefile and CI pass the
# same path.
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=api
    --cov-config=../../.coverage-config.ini
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-report=json:coverage.json
    --timeout=300
    --timeout-method=thread
    -ra
markers =
    unit: Unit tests
    integration: Integration tests
    api: API endpoint tests
    slow: Slow running tests
    performance: Performance tests
    contract: API contract tests
    e2e: End-to-end tests
    real_subprocess: Allowed to start real processes (conftest refuses them otherwise)
timeout = 300
# api.server warns at import when SECRET_KEY / ALLOWED_ORIGINS are unset, which
# is always true under test. Tests that care assert these with pytest.warns.
filterwarnings =
    ignore:No SECRET_KEY configured:UserWarning
    ignore:ALLOWED_ORIGINS is unset:UserWarning
