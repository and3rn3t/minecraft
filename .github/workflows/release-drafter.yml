# Drafts an in-progress GitHub Release from merged PRs. Categories/template
# live in .github/release-drafter.yml (local, repo-specific). See
# reusable-release-drafter.yml for the shared runner.
name: Release Drafter

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]

# release-drafter creates and updates a draft release, so the reusable
# workflow's job asks for contents: write. A called workflow cannot escalate
# beyond what the caller grants, so granting only contents: read here made
# every run fail at startup.
permissions:
  contents: write
  pull-requests: write

jobs:
  update-release-draft:
    uses: and3rn3t/.github/.github/workflows/reusable-release-drafter.yml@v1
