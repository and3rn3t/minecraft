name: Main CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Weekly, to exercise the browser tests that are skipped on pull requests
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Cancel a superseded run, but only on pull requests. On main, build-docker
# pushes to ghcr.io; cancelling that run mid-push can leave a half-published
# tag, so a push to main always runs to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The pre-commit hooks: ruff, shellcheck, yamllint, markdownlint, gitleaks,
  # actionlint and the whitespace/EOF/compose checks. .pre-commit-config.yaml
  # is the one place these tool versions are declared; this job runs exactly
  # what `make ci` runs locally, so a failure here is reproducible with
  # `pre-commit run --all-files`.
  pre-commit:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - run: pip install pre-commit

      - run: pre-commit run --all-files --show-diff-on-failure

  # Linting and syntax checks
  lint:
    name: Lint and Syntax Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check shell script syntax
        run: |
          find scripts tests -name "*.sh" -type f | while read -r script; do
            echo "Checking: $script"
            if grep -qE "^@test|^#!/usr/bin/env bats|^#!/bin/bats" "$script"; then
              echo "Skipping BATS test file: $script"
              continue
            fi
            bash -n "$script" || exit 1
          done

      - name: Validate docker-compose.yml
        run: |
          if [ -f docker-compose.yml ]; then
            docker compose config --quiet
          fi

  # Python API tests
  python-tests:
    name: Python API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install -r api/requirements-test.txt

      - name: Run API tests (parallel)
        timeout-minutes: 15
        env:
          TESTING: 'true'
          PYTEST_CURRENT_TEST: '1'
        run: |
          cd tests/api
          pytest -v -n auto \
            --cov=../../api \
            --cov-config=../../.coverage-config.ini \
            --cov-report=term-missing \
            --cov-report=html:htmlcov \
            --cov-report=json:coverage.json \
            --cov-report=xml:coverage.xml \
            --timeout=300 \
            --timeout-method=thread \
            -ra

      # Coverage is intentionally disabled here (--no-cov): the suite-wide
      # coverage threshold in .coverage-config.ini is checked against the full
      # test run above, and a marker-filtered subset exercises only a sliver
      # of the codebase, so measuring coverage against it fails on arithmetic
      # every time regardless of whether the contract tests themselves pass.
      # That's what the old `|| echo` was actually working around, not test
      # flakiness — with coverage off this is a real, always-honest gate.
      - name: Run contract tests
        run: |
          cd tests/api
          pytest -v -m contract --no-cov

      # Kept off the pull-request path: these assert hard wall-clock
      # thresholds (e.g. "< 50ms"), which is exactly the kind of check that
      # flakes on a shared, variably-loaded runner. Scheduled and manual runs
      # are where a real regression is worth seeing and a noisy runner isn't
      # blocking anyone's merge.
      - name: Run performance tests
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          cd tests/api
          pytest -v -m performance --no-cov

      - name: Analyze coverage gaps
        run: |
          chmod +x scripts/analyze-coverage-gaps.sh
          ./scripts/analyze-coverage-gaps.sh analyze || echo "Coverage gap analysis completed"

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-reports
          path: |
            tests/api/coverage.json
            tests/api/coverage.xml
            tests/api/htmlcov/
            coverage-gaps.txt
          retention-days: 30

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./tests/api/coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # Bash script tests
  bash-tests:
    name: Bash Script Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Not cached: the previous cache saved only /usr/local/bin/bats, which is
      # a symlink into /usr/local/libexec/bats-core/. On a cache hit the
      # symlink was restored with nothing to point at, the install step was
      # skipped, and every bats invocation failed instantly. Installing takes
      # about two seconds, so the cache bought nothing and broke every run
      # after the first.
      - name: Install BATS
        run: |
          git clone --depth 1 --branch v1.14.0 \
            https://github.com/bats-core/bats-core.git /tmp/bats
          sudo /tmp/bats/install.sh /usr/local
          bats --version

      - name: Run bash tests
        run: |
          chmod +x scripts/*.sh tests/**/*.sh
          ./scripts/run-tests.sh bash

  # Frontend tests. Gates build-docker and the summary below like every other
  # job here — despite the name this job once had, nothing about it is
  # non-blocking.
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Run Vitest tests
        working-directory: web
        run: npm run test:ci

  # Playwright browser tests. These drive a real browser against a running
  # stack, so they are kept off the pull-request path and run on a schedule or
  # on demand instead. See the `on:` block above.
  playwright-tests:
    name: Playwright Tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: web
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        working-directory: web
        # Use 4 workers for parallel execution (faster than default 1 worker)
        # With 3 test files × 3 browsers = 9 test runs, 4 workers should complete in ~3 minutes
        run: npx playwright test --workers=4 || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 30

  # Build Docker image
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    # pre-commit is included so a lint failure can't publish an image: this
    # job pushes to ghcr.io on push-to-main, and pre-commit was previously
    # only a dependency of `summary`, which runs in parallel with this job
    # rather than before it — so the push could complete before the failure
    # was even reported.
    needs: [pre-commit, lint, python-tests, bash-tests, frontend-tests]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        id: image-name
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "image=ghcr.io/${{ github.repository_owner }}/minecraft-server" >> "$GITHUB_OUTPUT"
          else
            echo "image=minecraft-server" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image-name.outputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-,enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image (ARM64 for Raspberry Pi 5)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MINECRAFT_VERSION=1.20.4
            BUILDKIT_INLINE_CACHE=1
          cache-from: type=gha,scope=build-docker
          cache-to: type=gha,mode=max,scope=build-docker

      - name: Inspect image
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: |
          # Get the image name and first tag
          IMAGE_NAME="${{ steps.image-name.outputs.image }}"
          # Metadata action outputs tags separated by newlines, get first one
          FIRST_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          if [ -z "$FIRST_TAG" ]; then
            # Fallback: use image name with latest tag
            FIRST_TAG="${IMAGE_NAME}:latest"
          fi
          echo "Inspecting image: $FIRST_TAG"
          docker image inspect "$FIRST_TAG" --format='{{.Size}}' | \
            awk '{printf "Image size: %.2f MB\n", $1/1024/1024}'
          docker image inspect "$FIRST_TAG" --format='{{range .RootFS.Layers}}{{println .}}{{end}}' | wc -l | \
            awk '{print "Number of layers: " $1}'

  # Summary job
  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs:
      [
        pre-commit,
        lint,
        python-tests,
        bash-tests,
        frontend-tests,
        playwright-tests,
        build-docker,
      ]
    if: always()
    steps:
      - name: Check test results
        run: |
          {
            echo "## Pipeline Summary"
            echo ""
            echo "| Job | Status |"
            echo "|-----|--------|"
            echo "| Pre-commit | ${{ needs.pre-commit.result }} |"
            echo "| Lint | ${{ needs.lint.result }} |"
            echo "| Python Tests | ${{ needs.python-tests.result }} |"
            echo "| Bash Tests | ${{ needs.bash-tests.result }} |"
            echo "| Frontend Tests | ${{ needs.frontend-tests.result }} |"
            echo "| Playwright Tests | ${{ needs.playwright-tests.result }} |"
            echo "| Docker Build | ${{ needs.build-docker.result }} |"
            echo ""
            echo "### Testing Enhancements"
            echo "- ✅ Parallel test execution enabled"
            echo "- ✅ Performance tests included"
            echo "- ✅ Contract tests included"
            echo "- ✅ Coverage gap analysis included"
            echo "- ✅ Multiple coverage report formats (HTML, JSON, XML)"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.pre-commit.result }}" != "success" ] || \
             [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.python-tests.result }}" != "success" ] || \
             [ "${{ needs.bash-tests.result }}" != "success" ] || \
             [ "${{ needs.frontend-tests.result }}" != "success" ] || \
             [ "${{ needs.build-docker.result }}" != "success" ]; then
            echo "❌ Critical jobs failed!" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "✅ All critical jobs passed!" >> "$GITHUB_STEP_SUMMARY"
          fi
