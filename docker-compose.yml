services:
  minecraft:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - MINECRAFT_VERSION=${MINECRAFT_VERSION:-1.20.4}
    container_name: minecraft-server
    hostname: minecraft-server
    restart: on-failure
    ports:
      - '${SERVER_PORT:-25565}:25565'
      # RCON has no transport encryption and grants full command execution, so
      # it's bound to loopback only. The API server (api/rcon.py) runs
      # directly on the host and reaches it via 127.0.0.1, not the container
      # network, which is why this needs a host port at all.
      - '127.0.0.1:${RCON_PORT:-25575}:25575'
    environment:
      - MINECRAFT_VERSION=${MINECRAFT_VERSION:-1.20.4}
      - MEMORY_MIN=${MEMORY_MIN:-1G}
      - MEMORY_MAX=${MEMORY_MAX:-2G}
      - SERVER_PORT=${SERVER_PORT:-25565}
      - EULA=${EULA:-TRUE}
      - TZ=${TZ:-UTC}
      - SERVER_TYPE=${SERVER_TYPE:-vanilla}
      - CONTAINER_MEMORY_LIMIT=${CONTAINER_MEMORY_LIMIT:-3G}
    volumes:
      - ./data:/minecraft/server
      - ./backups:/minecraft/backups
      - ./plugins:/minecraft/plugins
      - ./config:/minecraft/config:ro
    stdin_open: true
    tty: true
    healthcheck:
      # Probe the game port so "healthy" means the server accepts connections.
      # Must be the exec form invoking bash: CMD-SHELL runs /bin/sh, which is
      # dash on Jammy, and /dev/tcp is a bash-only redirection.
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/25565'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    networks:
      - minecraft-net
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          # Must exceed MEMORY_MAX: the JVM needs roughly 0.5-1G beyond the
          # heap for metaspace, thread stacks and direct buffers. Setting this
          # equal to MEMORY_MAX is what causes the restart loop documented in
          # docs/RESTART_LOOP_TROUBLESHOOTING.md.
          memory: ${CONTAINER_MEMORY_LIMIT:-3G}
        reservations:
          memory: ${MEMORY_MIN:-1G}

networks:
  minecraft-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
