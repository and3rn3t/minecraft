# Pre-commit hooks configuration
# Install: pip install pre-commit && pre-commit install

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # Markdown uses a trailing two-space run as a hard line break
        # (.editorconfig sets trim_trailing_whitespace = false for *.md for the
        # same reason). Without this flag the hook strips those breaks and
        # several docs render as one run-on paragraph instead of a list.
        args: ["--markdown-linebreak-ext=md"]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        # VS Code settings files are JSONC: comments are valid there and
        # this hook only understands strict JSON.
        exclude: ^\.vscode/
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck
        # Matches scripts/lint.sh. .shellcheckrc sets enable=all, so without a
        # severity floor every script fails on style preferences and the hook
        # gets bypassed rather than heeded.
        args: ["-x", "-S", "error"]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: ["-d", "{extends: default, rules: {line-length: {max: 120}}}"]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        args: ["--fix"]

  # Mirrors the Gitleaks workflow, which scans the commits a PR adds. Running
  # it here means a placeholder that trips the entropy rules is caught before
  # it is pushed rather than by a failed check.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  # No args: ruff reads [tool.ruff] from pyproject.toml, which is the one
  # place those settings live. Passing them here as well is how the editor and
  # the hook drift apart.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      - id: docker-compose-check
        name: Check docker-compose.yml
        # Reuses the same v2-preferred, v1-fallback detection as the
        # Makefile's $(COMPOSE) and scripts/lib/common.sh's compose() helper,
        # rather than hard-coding the v2 form: the runner image only has v2,
        # but a contributor's machine may only have the legacy binary, and
        # this hook should not be stricter than the rest of the project.
        entry: bash -c 'source scripts/lib/common.sh && compose config --quiet'
        language: system
        pass_filenames: false
        always_run: true

      - id: shell-syntax-check
        name: Check shell script syntax
        entry: scripts/check-shell-syntax.sh
        language: script
        files: '\.sh$'
        pass_filenames: true
